<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280">
  <defs>
    <clipPath id="circle-clip">
      <circle cx="120" cy="110" r="90" />
    </clipPath>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- HUD Frame Elements -->
  <g stroke="#26324A" stroke-width="1.5" fill="none">
    <path d="M 30,110 A 90,90 0 0,1 210,110" stroke-dasharray="4 6" opacity="0.6" />
    <path d="M 30,110 A 90,90 0 0,0 210,110" stroke-dasharray="1 10" opacity="0.4" />
    
    <!-- Crosshairs -->
    <line x1="20" y1="110" x2="35" y2="110" stroke="#67E8F9" />
    <line x1="205" y1="110" x2="220" y2="110" stroke="#67E8F9" />
    <line x1="120" y1="10" x2="120" y2="25" stroke="#67E8F9" />
    <line x1="120" y1="195" x2="120" y2="210" stroke="#67E8F9" />
  </g>

  <!-- The Avatar -->
  <image href="data:image/png;base64,Tm90IEZvdW5k" x="30" y="20" width="180" height="180" clip-path="url(#circle-clip)" preserveAspectRatio="xMidYMid slice" />

  <!-- Cyan Border -->
  <circle cx="120" cy="110" r="90" fill="none" stroke="#67E8F9" stroke-width="2" filter="url(#glow)" opacity="0.8" />

  <!-- Text -->
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" text-anchor="middle">
    <text x="120" y="240" fill="#F4F7FF" font-weight="bold" letter-spacing="1">BHAVESH // AI BUILDER</text>
    <text x="120" y="265" fill="#67E8F9" opacity="0.8" letter-spacing="1">STATUS // BUILDING</text>
  </g>
</svg>
