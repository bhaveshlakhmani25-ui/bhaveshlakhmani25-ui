<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 40" width="100%" height="40">
  <defs>
    <!-- Glass Material Gradients -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(139, 92, 246, 0.15)" />
      <stop offset="50%" stop-color="rgba(17, 19, 24, 0.4)" />
      <stop offset="100%" stop-color="rgba(34, 211, 238, 0.05)" />
    </linearGradient>

    <!-- Edge Highlighting -->
    <linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(34, 211, 238, 0.3)" />
      <stop offset="100%" stop-color="rgba(139, 92, 246, 0.1)" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-4px) rotate(2deg); }
      }
      @keyframes float-alt {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(3px) rotate(-1deg); }
      }
      .anim-1 { animation: float 10s ease-in-out infinite; transform-origin: center; }
      .anim-2 { animation: float-alt 12s ease-in-out infinite; transform-origin: center; }
    </style>
  </defs>

  <!-- We don't draw a background rect here, so the divider is completely transparent -->

  <!-- Left faint edge fragment -->
  <g class="anim-1" filter="url(#glow)">
    <polygon points="10,20 40,15 25,35" fill="url(#glass)" stroke="url(#edge)" stroke-width="0.5" opacity="0.6" />
    <!-- Cyber accent line -->
    <line x1="20" y1="20" x2="150" y2="20" stroke="rgba(34, 211, 238, 0.1)" stroke-width="0.5" stroke-dasharray="2 4" />
  </g>

  <!-- Right soft shard silhouette -->
  <g class="anim-2" filter="url(#glow)">
    <polygon points="780,5 710,25 760,35" fill="url(#glass)" stroke="url(#edge)" stroke-width="1" opacity="0.4" />
    <polygon points="780,5 760,35 770,20" fill="rgba(139, 92, 246, 0.1)" />
    <!-- Cyber accent line -->
    <line x1="650" y1="20" x2="730" y2="20" stroke="rgba(139, 92, 246, 0.2)" stroke-width="0.5" stroke-dasharray="1 3" />
  </g>
</svg>
